<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Chattr. is a modern social platform where you can share your thoughts, connect with others, and express yourself freely."
    />
    <meta
      name="keywords"
      content="Chattr, social media, connect, share, profile, feed, post, messaging, modern platform, responsive web app, chat app"
    />
    <!-- Favicon -->
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/assets/favicon/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/assets/favicon/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/assets/favicon/favicon-16x16.png"
    />
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <!-- Font Awesome icons -->
    <script
      src="https://kit.fontawesome.com/11ca27fbbb.js"
      crossorigin="anonymous"
    ></script>
    <!-- Stylesheets -->
    <link rel="stylesheet" href="/dist/bootstrap.min.css" />
    <link rel="stylesheet" href="/dist/style.css" />
    <title>Chattr. | Feed</title>
  </head>
  <body>
    <!-- Header -->
    <header class="py-2 border-bottom border-dark">
      <nav class="navbar position-relative px-3" aria-label="Main navigation">
        <a href="/index.html" class="navbar-brand logo">Chattr.</a>

        <!-- Mobile toggle button -->
        <button
          class="navbar-toggler d-block border-dark text-dark d-sm-none py-2"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#mobile-menu"
          aria-controls="mobile-menu"
          aria-expanded="false"
          aria-label="Toggle mobile navigation"
        >
          <i class="fa-solid fa-bars fs-3" aria-hidden="true"></i>
        </button>

        <!-- Desktop navbar -->
        <div class="d-none d-sm-flex me-4">
          <ul class="d-flex gap-5 m-0">
            <li class="nav-item list-unstyled">
              <a href="/index.html" class="nav-link fw-semibold">Login</a>
            </li>
            <li class="nav-item list-unstyled">
              <a
                href="index.html"
                class="nav-link fw-semibold active-link"
                aria-current="page"
                >Feed</a
              >
            </li>
            <li class="nav-item list-unstyled">
              <a href="/profile/index.html" class="nav-link fw-semibold"
                >Profile</a
              >
            </li>
          </ul>
        </div>
      </nav>

      <!-- Mobile navbar -->
      <div class="collapse d-sm-none border-top border-dark" id="mobile-menu">
        <ul class="d-flex gap-5 justify-content-center mb-2 mt-3">
          <li class="nav-item list-unstyled">
            <a href="/index.html" class="nav-link fw-semibold">Login</a>
          </li>
          <li class="nav-item list-unstyled">
            <a
              href="index.html"
              class="nav-link fw-semibold active-link"
              aria-current="page"
              >Feed</a
            >
          </li>
          <li class="nav-item list-unstyled">
            <a href="/profile/index.html" class="nav-link fw-semibold"
              >Profile</a
            >
          </li>
        </ul>
      </div>
    </header>
    <!-- Main Content -->
    <main class="container mb-5">
      <section
        class="d-flex align-items-center justify-content-between mb-4 mt-5"
      >
        <!-- Search input -->
        <div class="input-group w-50">
          <input
            aria-label="Search posts"
            type="search"
            class="form-control border-primary shadow-sm"
            placeholder="Search posts…"
          />
          <button class="btn btn-primary" aria-label="Search">Search</button>
        </div>

        <!-- Sorting -->
        <div>
          <label for="sortSelect" class="form-label me-2 fw-semibold"
            >Sort by</label
          >
          <select
            id="sortSelect"
            aria-label="Sort posts"
            class="form-select d-inline-block w-auto border-primary shadow-sm"
          >
            <option>Date</option>
            <option>Popularity</option>
            <option>Author</option>
          </select>
        </div>
      </section>

      <!-- New Post form -->
      <section class="card shadow-sm border-primary p-4 mb-5">
        <h1 class="mb-3 fs-2">New Post</h1>
        <form action="#" aria-label="New post form">
          <div class="mb-2">
            <input
              type="text"
              name="postTitle"
              aria-label="Post title"
              placeholder="Post Title"
              required
              class="form-control border-dark"
            />
          </div>
          <div class="mb-2">
            <textarea
              name="postContent"
              aria-label="Post content"
              placeholder="Write your thoughts here..."
              required
              rows="4"
              class="form-control border-dark"
            ></textarea>
          </div>
          <div class="mb-2">
            <input
              aria-label="Post thumbnail"
              type="url"
              name="postThumbnail"
              placeholder="Thumbnail URL (optional)"
              class="form-control border-dark"
            />
          </div>
          <button type="submit" class="btn btn-primary mt-2 w-100">Post</button>
        </form>
      </section>
    </main>

    <!-- Bootstrap JS -->
    <script src="/js/bootstrap.bundle.min.js" defer></script>
  </body>
</html>
